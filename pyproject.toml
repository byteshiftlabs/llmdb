[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmdb"
version = "0.1.0"
description = "GDB/MI MCP server — interactive debugging for LLMs"
license = {text = "MIT"}
requires-python = ">=3.10,<3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "mcp>=1.0.0",
    "pygdbmi>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-mock>=3.12,<4.0",
]

[project.scripts]
llmdb = "llmdb.server:main"
llmdb-monitor = "llmdb.monitor:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
